[project]
name = "kakao"
version = "0.0.0"
description = "Real-time translated subtitles overlaid on any system audio (Windows MVP)."
requires-python = ">=3.11"
authors = [{ name = "andrespisa4" }]
# Runtime dependencies are added in the phase that actually uses them, so no
# unused dependency enters the project. See docs/ai-context/ROADMAP.md.
dependencies = [
    "numpy>=1.24",
    "soundcard>=0.4",            # WASAPI loopback (DD-02 / D-011); imported only in kakao.audio
    "silero-vad>=5",            # voice-activity segmentation (D-004 / D-013); pulls torch-CPU
    "faster-whisper>=1.0",       # ASR: audio -> English, one hop (D-001 / D-009); in kakao.asr
    "nvidia-cuda-runtime-cu12",  # cudart64_12.dll — cuBLAS depends on it
    "nvidia-cublas-cu12",        # GPU BLAS for CTranslate2 (Windows needs the wheel)
    "nvidia-cudnn-cu12",         # cuDNN 9 for CTranslate2 CUDA 12
    "pyside6>=6.6",              # overlay GUI (DD-03 / D-018): transparent, click-through
]

[dependency-groups]
dev = ["pytest>=8"]
# Phase 0 VRAM probe only (scripts/spike_phase0.py). faster-whisper + CUDA wheels
# are now runtime deps (Phase 3), so the spike group only needs the NVML binding.
spike = ["nvidia-ml-py>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "SIM", "RET", "UP"]
# ARG002: Qt overrides must keep the framework's signature even when unused.
ignore = ["ARG002", "B008"]
